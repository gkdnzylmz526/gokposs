crons:
  - name: daily-report
    description: "Emails the end-of-day PDF report to the manager every night at 23:59 Istanbul time"
    cron: "59 23 * * *"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/daily-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-summary
    description: "Emails last week's top sellers and total profit every Monday at 09:00 Istanbul time"
    cron: "0 9 * * 1"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-summary
    description: "Emails last month's revenue, payroll and top sellers on the 1st of each month at 09:00 Istanbul time"
    cron: "0 9 1 * *"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/monthly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: cash-reminder
    description: "Emails a reminder at 23:30 Istanbul time if today's cash closing has not been entered"
    cron: "30 23 * * *"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/cash-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: missing-revenue
    description: "Emails the restaurant manager at 23:00 Istanbul time if that day's revenue has not been entered"
    cron: "0 23 * * *"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/missing-revenue"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
